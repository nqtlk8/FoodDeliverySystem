# ==========================================
# 1. CẤU HÌNH SERVER & APPLICATION
# ==========================================
server.port=8082
spring.application.name=voucher

# ==========================================
# 2. CẤU HÌNH DATABASE (POSTGRESQL)
# ==========================================
# Lưu ý: 'postgres' ở đây là tên container (service name) trong file docker-compose.yml
spring.datasource.url=jdbc:postgresql://postgres:5432/voucher_db
spring.datasource.username=admin
spring.datasource.password=admin_password
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# 3. CẤU HÌNH JPA / HIBERNATE
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# QUAN TRỌNG NHẤT: Dùng 'validate' để Hibernate chỉ kiểm tra Schema chứ KHÔNG TỰ TẠO/XÓA BẢNG.
# Điều này giúp giữ nguyên vẹn dữ liệu do file init.sql tạo ra.
spring.jpa.hibernate.ddl-auto=validate

# Hiển thị SQL trên log để dễ debug (Dev mode)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# 4. CẤU HÌNH KAFKA (MESSAGE BROKER)
# ==========================================
# Lưu ý: 'kafka' là tên container trong docker-compose.yml
spring.kafka.bootstrap-servers=kafka:9092

# --- Cấu hình Consumer (Lắng nghe sự kiện) ---
spring.kafka.consumer.group-id=promotion-group
# earliest: Đọc lại các message cũ nếu service bị sập rồi khởi động lại
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
# Cho phép deserialize tất cả các package (tránh lỗi JSON mapping)
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# --- Cấu hình Producer (Phát sự kiện) ---
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer