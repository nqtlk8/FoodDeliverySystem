

networks:
  food-network:
    driver: bridge

services:
  # ==========================================
  # 1. INFRASTRUCTURE (HẠ TẦNG)
  # ==========================================
  
  # Database dùng chung (PostgreSQL)
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
    ports:
      - "5432:5432"
    volumes:
      # Map file init.sql vào thư mục đặc biệt này của Postgres
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - food-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root"]
      interval: 10s
      retries: 5

  # Kafka Broker (Sử dụng KRaft - Không cần Zookeeper)
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Q1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - food-network

  # Keycloak (Xác thực)
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak-server
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-db:5432/user_db
      KC_DB_USERNAME: root
      KC_DB_PASSWORD: rootpassword
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080" # Map ra port 8081 để không trùng với Gateway
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - food-network

  # ==========================================
  # 2. APPLICATION MODULES (MICROSERVICES)
  # ==========================================

  # API Gateway
  api-gateway:
    build: 
      context: ./gateway # Trỏ tới thư mục chứa source code gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    extra_hosts:
      - "localhost:host-gateway"
    environment:
      # Ghi đè cấu hình trong application.yml để dùng container name
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - keycloak
      - kafka
    networks:
      - food-network

  # Voucher Module
  voucher-module:
    build: 
      context: ./voucher
    container_name: voucher-module
    ports:
      - "8082:8082" # Giả sử voucher module chạy port 8082
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/voucher_db
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=rootpassword
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      # Đảm bảo database cập nhật schema tự động (dành cho môi trường dev)
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update 
    depends_on:
      postgres-db:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - food-network

volumes:
  postgres_data:
  kafka_data: